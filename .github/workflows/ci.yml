name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/privacy_scan.py

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify installed wheel and WebUI assets
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from find_my_timeline.database import LocationDatabase
          from find_my_timeline.web import create_app

          with TemporaryDirectory() as directory:
              app = create_app(LocationDatabase(Path(directory) / "locations.db"))
              app.config.update(TESTING=True)
              response = app.test_client().get("/")
              assert response.status_code == 200
              assert b"Settings &amp; status" in response.data
          PY

  unraid-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Parse Unraid template
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('templates/find-my-timeline.xml')"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag find-my-timeline:ci .
      - name: Start credential-free application container
        run: |
          docker run --detach --name find-my-timeline-ci \
            --publish 127.0.0.1:5010:5000 \
            find-my-timeline:ci
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5010/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs find-my-timeline-ci
          exit 1
      - name: Verify rendered WebUI
        run: |
          curl --fail --silent http://127.0.0.1:5010/ | grep --fixed-strings 'Settings &amp; status'
          curl --fail --silent http://127.0.0.1:5010/api/auth/status | grep --fixed-strings '"username_configured":false'
      - name: Stop smoke container
        if: always()
        run: docker rm --force find-my-timeline-ci || true
