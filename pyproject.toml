[project]
name = "find-my-timeline"
version = "0.2.2"
description = "Self-hosted Apple Find My location history for Unraid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyicloud>=1.0.0",
    "click>=8.0.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=find_my_timeline --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
omit = [
    "*/find_my_timeline/__init__.py",
    "*/find_my_timeline/auth.py",
    "*/find_my_timeline/cli.py",
]

[project.scripts]
find-my-timeline = "find_my_timeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_my_timeline"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "find_my_timeline/templates"
"static" = "find_my_timeline/static"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/static",
]
