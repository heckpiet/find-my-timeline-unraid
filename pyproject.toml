[project]
name = "find-my-timeline"
version = "0.4.3"
description = "Self-hosted Apple Find My location history for Unraid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyicloud>=2.6.5,<3",
    "click>=8.2,<9",
    "flask>=3.1,<4",
    "python-dotenv>=1.1,<2",
    "waitress>=3.0.2,<4",
]

[project.optional-dependencies]
test = [
    "build>=1.3,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=find_my_timeline --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
omit = [
    "*/find_my_timeline/__init__.py",
    "*/find_my_timeline/auth.py",
    "*/find_my_timeline/cli.py",
]

[project.scripts]
find-my-timeline = "find_my_timeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_my_timeline"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "find_my_timeline/templates"
"static" = "find_my_timeline/static"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/static",
]
